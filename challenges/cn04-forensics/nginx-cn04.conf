server {
    listen 8084;
    server_name cn04-forensics;

    auth_basic "CeylonGov Secure - Evidence Archive (Authorized Personnel Only)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }
}
