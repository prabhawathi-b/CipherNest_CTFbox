server {
    listen 8084;
    server_name cn04-forensics;
    root /usr/share/nginx/html;

    location = /staging_evidence.bin {
        auth_basic "CN-04 evidence archive - use the login recovered in CN-03";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
