<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Portal - CipherNest</title><link rel="stylesheet" href="/static/ciphernest.css"></head>
<body><header class="nav"><a class="logo" href="/">CIPHERNEST</a><nav><a href="/dashboard">Dashboard</a></nav></header>
