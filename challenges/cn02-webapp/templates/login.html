<!DOCTYPE html>
<html>
<head><title>CeylonGov Secure - Staff Portal</title></head>
<body style="font-family: sans-serif; max-width: 500px; margin: 60px auto;">
  <h2>CeylonGov Secure - Legacy Staff Portal</h2>
  <p style="color: #888;">This portal is scheduled for decommission.</p>
  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}
  <form method="POST">
    <p>Username: <input type="text" name="username"></p>
    <p>Password: <input type="password" name="password"></p>
    <button type="submit">Log In</button>
  </form>
</body>
</html>
