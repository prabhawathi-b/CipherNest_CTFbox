version: "3.9"

networks:
  ctf-frontnet:
    driver: bridge
  ctf-challnet:
    driver: bridge
    internal: true

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: ciphernest-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./challenges/cn03-crypto:/usr/share/nginx/cn03:ro
    networks:
      - ctf-frontnet
      - ctf-challnet
    depends_on:
      - platform
      - cn01-stego
      - cn02-webapp
      - cn04-forensics
      - cn05-capture
      - cn06-profile

  platform:
    build:
      context: ./platform
    container_name: ciphernest-platform
    restart: unless-stopped
    environment:
      - FLAG_DB_PATH=/data/flags.db
    volumes:
      - platform-data:/data
    networks:
      - ctf-frontnet

  cn01-stego:
    build:
      context: ./challenges/cn01-stego
    container_name: ciphernest-cn01-stego
    restart: unless-stopped
    networks:
      - ctf-challnet

  cn02-webapp:
    build:
      context: ./challenges/cn02-webapp
    container_name: ciphernest-cn02-webapp
    restart: unless-stopped
    networks:
      - ctf-challnet

  cn04-forensics:
    build:
      context: ./challenges/cn04-forensics
    container_name: ciphernest-cn04-forensics
    restart: unless-stopped
    networks:
      - ctf-challnet

  cn05-target:
    build:
      context: ./challenges/cn05-network/target
    container_name: ciphernest-cn05-target
    restart: unless-stopped
    ports:
      - "127.0.0.1:2221:21"
      - "127.0.0.1:2121-2130:2121-2130"
    networks:
      - ctf-challnet
      - ctf-frontnet

  cn05-capture:
    build:
      context: ./challenges/cn05-network/capture
    container_name: ciphernest-cn05-capture
    restart: unless-stopped
    networks:
      - ctf-challnet

  cn06-profile:
    build:
      context: ./challenges/cn06-profile
    container_name: ciphernest-cn06-profile
    restart: unless-stopped
    networks:
      - ctf-challnet

volumes:
  platform-data:
