version: "3.9"

networks:
  ctf-frontnet:
    driver: bridge
  ctf-challnet:
    driver: bridge
    internal: true

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: ciphernest-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ctf-frontnet
      - ctf-challnet
    depends_on:
      - platform
      - cn01-stego

  platform:
    build:
      context: ./platform
    container_name: ciphernest-platform
    restart: unless-stopped
    environment:
      - FLAG_DB_PATH=/data/flags.db
    volumes:
      - platform-data:/data
    networks:
      - ctf-frontnet

  cn01-stego:
    build:
      context: ./challenges/cn01-stego
    container_name: ciphernest-cn01-stego
    restart: unless-stopped
    networks:
      - ctf-challnet

volumes:
  platform-data:
